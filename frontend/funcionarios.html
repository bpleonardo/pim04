<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funcionários — Navalha & Estilo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/funcionarios.css" />
  </head>
  <body class="min-vh-100">
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="section-tag d-block text-uppercase">Funcionários</span>
          <h1 class="page-title mb-0">Equipe</h1>
        </div>
        <div>
          <button id="btn-new-func" class="btn btn-warning">Novo funcionário</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>E-mail</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="funcionarios-body">
            <tr><td colspan="4">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Modal novo funcionário -->
      <div class="modal fade" id="modalFuncionario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Novo funcionário</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <form id="funcionario-form">
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Nome</label>
                  <input required name="nome" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Telefone</label>
                  <input required name="telefone" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">E-mail</label>
                  <input name="email" type="email" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Endereço</label>
                  <input required name="endereco" class="form-control" />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-warning">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>

    <!-- Toasts container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="js/funcionarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
