<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navalha & Estilo — Agenda do Dia</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/agenda.css" />
  </head>
  <body class="agenda-body">
    <div class="agenda-shell">
      <aside class="agenda-sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="sidebar-brand logo" href="dashboard.html" aria-label="Navalha e Estilo, Dashboard">
          <span class="logo-name">Navalha<span>&</span>Estilo</span>
          <span class="logo-sub d-block">Barbearia</span>
        </a>

        <nav class="sidebar-nav" aria-label="Menu do sistema">
          <a class="sidebar-link" href="dashboard.html">📊 Dashboard</a>
          <a class="sidebar-link active" href="agenda.html" aria-current="page">📅 Agenda do dia</a>
          <a class="sidebar-link" href="clientes.html">👥 Clientes</a>
          <a class="sidebar-link" href="em-desenvolvimento.html">✂ Serviços</a>
          <a class="sidebar-link" href="em-desenvolvimento.html">👤 Funcionários</a>
          <a class="sidebar-link" href="financeiro.html">💰 Financeiro</a>
          <a class="sidebar-link" href="login.html">🚪 Sair</a>
        </nav>
      </aside>

      <div class="agenda-backdrop" id="backdrop" hidden></div>

      <div class="agenda-main">
        <header class="agenda-topbar">
          <button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="topbar-title">Agenda do Dia</div>

          <div class="profile-chip" aria-label="Perfil logado">
            <span class="profile-name">Gerente</span>
            <span class="profile-avatar" aria-hidden="true">G</span>
          </div>
        </header>

        <main class="agenda-content">
          <section class="page-heading d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
            <div>
              <span class="section-tag d-block text-uppercase">Controle de atendimentos</span>
              <h1 class="page-title mb-0">Agenda do Dia</h1>
            </div>

            <div class="date-navigation" aria-label="Navegação de data">
              <button class="date-nav-btn" id="prevDate" type="button" aria-label="Dia anterior">←</button>
              <div class="current-date current-date-centered" id="selectedDate"></div>
              <button class="date-nav-btn" id="nextDate" type="button" aria-label="Próximo dia">→</button>
            </div>
          </section>

          <section class="filters-row mb-4" aria-label="Filtro de status">
            <button class="status-filter active" type="button" data-filter="all">Todos</button>
            <button class="status-filter" type="button" data-filter="pending">Pendentes</button>
            <button class="status-filter" type="button" data-filter="done">Concluídos</button>
            <button class="status-filter" type="button" data-filter="canceled">Cancelados</button>
          </section>

          <section id="agendaList" class="agenda-list" aria-label="Lista de agendamentos"></section>
        </main>
      </div>
    </div>

    <div class="appointment-modal" id="appointmentModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
      <div class="appointment-modal-backdrop" id="modalBackdrop"></div>
      <div class="appointment-modal-dialog" role="document">
        <div class="appointment-modal-card">
          <div class="modal-header-custom">
            <h2 class="modal-title-custom" id="modalTitle">Detalhes do Agendamento</h2>
            <button class="modal-close-btn" id="closeModal" type="button" aria-label="Fechar modal">×</button>
          </div>
          <div class="modal-body-custom" id="modalBody"></div>
          <div class="modal-footer-custom" id="modalFooter"></div>
        </div>
      </div>
    </div>

    <script src="js/agenda.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
