<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Metadados básicos da página -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título exibido na aba do navegador -->
    <title>Navalha & Estilo — Gestão</title>

    <!-- Bootstrap primeiro, depois os estilos da tela de login -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body
    class="login-page min-vh-100 d-flex align-items-center justify-content-center overflow-hidden position-relative py-4"
  >
    <!-- Fundos decorativos do layout de acesso -->
    <div class="bg-texture"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>

    <!-- Container principal dividido entre branding e formulário -->
    <main class="login-container d-flex overflow-hidden position-relative shadow-lg">
      <!-- Painel lateral com identidade da barbearia -->
      <section
        class="left-panel d-none d-lg-flex flex-column justify-content-between has-gradient position-relative overflow-hidden"
      >
        <!-- Elemento decorativo de fundo -->
        <div class="scissors-bg">✂</div>
        <!-- Marca clicável: retorna para a home -->
        <a class="logo brand-logo d-flex flex-column" href="index.html" aria-label="Voltar para a página inicial">
          <span class="brand-tag text-uppercase d-block mb-3">Sistema de Gestão</span>
          <span class="logo-name">Navalha<span>&</span>Estilo</span>
          <span class="logo-sub brand-logo-sub">Barbearia</span>
          <div class="divider"></div>
          <p class="tagline">Gerencie sua barbearia<br />com <em>precisão e estilo</em>.</p>
        </a>
        <!-- Lista curta de capacidades do sistema (preenchida por JS) -->
        <div id="features-list" class="features d-flex flex-column"></div>
      </section>

      <!-- Painel principal com login e validação -->
      <section class="right-panel d-flex flex-column justify-content-center">
        <!-- Título e subtítulo do acesso -->
        <div class="login-header">
          <div class="login-title h2 mb-1">Bem-vindo</div>
          <p class="login-sub mb-4">Acesse o painel de gestão</p>
        </div>

        <!-- Mensagem de erro do login -->
        <div class="alert alert-danger py-2 px-3" id="alert" role="alert">
          Login ou senha incorretos.
        </div>

        <!-- Formulário de autenticação -->
        <form class="w-100" id="login-form" novalidate>
          <div class="field mb-3">
            <label class="form-label small text-uppercase" for="login">Login</label>
            <input
              class="form-control"
              type="text"
              id="login"
              placeholder="seu.login"
              autocomplete="username"
            />
            <div class="error-msg" id="login-err">Preencha o login</div>
          </div>

          <div class="field mb-4">
            <label class="form-label small text-uppercase" for="senha">Senha</label>
            <input
              class="form-control"
              type="password"
              id="senha"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <div class="error-msg" id="senha-err">Preencha a senha</div>
          </div>

          <button class="btn-login btn btn-warning w-100 text-uppercase fw-semibold py-3" id="btn" type="submit">
            Entrar
          </button>
        </form>

        <!-- Atalho para voltar ao site público -->
        <div class="bottom-note mt-4 text-center">
          <a class="link-secondary link-offset-2 link-underline-opacity-0" href="index.html"
            >← Voltar ao site</a
          >
        </div>
      </section>
    </main>

    <!-- Scripts da tela de login e do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
