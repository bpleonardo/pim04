<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navalha & Estilo — Financeiro</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/financeiro.css" />
  </head>
  <body class="financeiro-body">
    <div class="financeiro-shell">
      <aside class="financeiro-sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="sidebar-brand logo" href="dashboard.html" aria-label="Navalha e Estilo, Dashboard">
          <span class="logo-name">Navalha<span>&</span>Estilo</span>
          <span class="logo-sub d-block">Barbearia</span>
        </a>

        <nav class="sidebar-nav" aria-label="Menu do sistema">
          <a class="sidebar-link" href="dashboard.html">📊 Dashboard</a>
          <a class="sidebar-link" href="agenda.html">📅 Agenda do dia</a>
          <a class="sidebar-link" href="clientes.html">👥 Clientes</a>
          <a class="sidebar-link" href="em-desenvolvimento.html">✂ Serviços</a>
          <a class="sidebar-link" href="em-desenvolvimento.html">👤 Funcionários</a>
          <a class="sidebar-link active" href="financeiro.html" aria-current="page">💰 Financeiro</a>
          <a class="sidebar-link" href="login.html">🚪 Sair</a>
        </nav>
      </aside>

      <div class="financeiro-backdrop" id="backdrop" hidden></div>

      <div class="financeiro-main">
        <header class="financeiro-topbar">
          <button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="topbar-title">Financeiro</div>

          <div class="profile-chip" aria-label="Perfil logado">
            <span class="profile-name">Gerente</span>
            <span class="profile-avatar" aria-hidden="true">G</span>
          </div>
        </header>

        <main class="financeiro-content">
          <section class="page-heading d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
            <div>
              <span class="section-tag d-block text-uppercase">Relatórios e controle</span>
              <h1 class="page-title mb-0">Financeiro</h1>
            </div>
          </section>

          <section class="period-filter mb-4" aria-label="Filtro de período">
            <div class="period-buttons">
              <button class="period-btn" type="button" data-period="hoje">Hoje</button>
              <button class="period-btn" type="button" data-period="semana">Esta semana</button>
              <button class="period-btn active" type="button" data-period="mes">Este mês</button>
              <button class="period-btn" type="button" data-period="personalizado">Personalizado</button>
            </div>

            <div class="custom-range" id="customRange" hidden>
              <div class="custom-range-field">
                <label class="form-label small text-uppercase" for="customStart">De:</label>
                <input class="form-control finance-input" id="customStart" type="date" />
              </div>
              <div class="custom-range-field">
                <label class="form-label small text-uppercase" for="customEnd">Até:</label>
                <input class="form-control finance-input" id="customEnd" type="date" />
              </div>
            </div>
          </section>

          <section class="metrics-grid metrics-grid-financeiro mb-4" id="indicatorsGrid" aria-label="Indicadores financeiros"></section>

          <section class="financeiro-grid">
            <article class="panel-card">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title mb-1">Faturamento por serviço</h2>
                </div>
              </div>
              <div class="popular-list" id="serviceBars"></div>
            </article>

            <article class="panel-card">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title mb-1">Últimas transações</h2>
                </div>
              </div>

              <div class="table-responsive finance-table-wrap">
                <table class="table finance-table align-middle mb-0">
                  <thead>
                    <tr>
                      <th scope="col">Data</th>
                      <th scope="col">Cliente</th>
                      <th scope="col">Serviço</th>
                      <th scope="col">Valor</th>
                    </tr>
                  </thead>
                  <tbody id="transactionsBody"></tbody>
                  <tfoot>
                    <tr class="transactions-total-row">
                      <td colspan="3" class="transactions-total-label">Total</td>
                      <td class="transactions-total-value" id="transactionsTotal"></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <script src="js/financeiro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
