# Ambiente base
services:
  backend:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    restart: no
  postgres:
    image: postgres:latest
    restart: no
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
  redis:
    image: redis:latest
    restart: no
  nginx:
    image: nginx:latest
    restart: no
    volumes:
      - ./resources/nginx/default.conf:/etc/nginx/conf.d/default.conf
volumes:
  postgres_data:
