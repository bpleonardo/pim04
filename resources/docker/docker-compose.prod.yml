# Ambiente produção
services:
  backend:
    ports: !reset
    env_file:
      - ./.env
    restart: unless-stopped

  postgres:
    ports: !reset
    env_file:
      - ./.env
    restart: unless-stopped

  redis:
    ports: !reset
    env_file:
      - ./.env
    restart: unless-stopped

  nginx:
    ports:
      - '80:80'
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./front_web:/srv/public:ro
      - type: bind
        source: ./frontend/build/web
        target: /srv/flutter/admin
        read_only: true
        bind:
          create_host_path: false
