server {
    listen 80;
    server_name _;

    root /srv/public;
    index index.html;

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        root /srv/flutter;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|agendamento\.html|css/(global|index|agendamento)\.css|js/(index|agendamento)\.js)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
